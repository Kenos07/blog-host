{% extends "base.html" %}
{% block title %}New Article — My Blog{% endblock %}
{% block content %}

<div class="form-page">
    <div class="form-page__header">
        <a href="{{ url_for('admin_dashboard') }}" class="back-link">← Back to Dashboard</a>
        <h1>New Article</h1>
    </div>

    <form method="POST" action="{{ url_for('admin_add') }}" class="form form--wide" enctype="multipart/form-data">

        <div class="form__group">
        <label for="title" class="form__label">Title <span class="required">*</span></label>
        <input
            type="text"
            id="title"
            name="title"
            class="form__input"
            value="{{ title }}"
            required
            autofocus
            placeholder="Enter article title"
        />
        </div>

        <div class="form__group">
        <label for="published_at" class="form__label">Publication Date &amp; Time<span class="required">*</span></label>
        <input
            type="datetime-local"
            id="published_at"
            name="published_at"
            class="form__input form__input--datetime"
            value="{{ published_at }}"
            required
        />
        </div>

        <div class="form__group">
            <label for="thumbnail" class="form__label">Thumbnail image</label>
            <input 
                type="file"
                id="thumbnail"
                name="thumbnail"
                class="form__input form__input--file"
                accept="image/png, image/jpg, image/jpeg"
            />
            <span class="form__hint">Optional. Support PNG, JPG</span>
        </div>

        <div class="form__group">
            <div class="editor-label-row">
                <label for="content" class="form__label">Content <span class="required">*</span></label>
                <div class="media-toolbar">
                    <button type="button" id="insertMediaBtn" class="btn btn--sm btn--ghost" title="Upload and insert an image or video at the cursor">
                        📎 Insert Media
                    </button>
                    <span id="uploadStatus" class="upload-status"></span>
                    <input
                        type="file"
                        id="mediaFileInput"
                        style="display:none"
                        accept="image/png,image/jpeg,image/gif,image/webp,image/avif,video/mp4,video/webm,video/ogg,video/quicktime"
                    />
                </div>
            </div>

            <textarea
                id="content"
                name="content"
                class="form__textarea"
                rows="20"
                required
                placeholder="Write your article here… Use Markdown for formatting, or click Insert Media to embed"
            >{{ content }}</textarea>

            <span class="form__hint">Supports Markdown: **bold**, *italic*, ## headings, - lists, `code`</span>
        </div>

        <div class="form__actions">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn--ghost">Cancel</a>
            <button type="submit" class="btn btn--primary">Publish Article</button>
        </div>

    </form>
</div>

{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='editor.js') }}"></script>
{% endblock %}
