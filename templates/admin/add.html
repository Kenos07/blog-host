{% extends "base.html" %}
{% block title %}New Article — My Blog{% endblock %}
{% block content %}

<div class="form-page">
    <div class="form-page__header">
        <a href="{{ url_for('admin_dashboard') }}" class="back-link">← Back to Dashboard</a>
        <h1>New Article</h1>
    </div>

    <form method="POST" action="{{ url_for('admin_add') }}" class="form form--wide">
        <div class="form__group">
        <label for="title" class="form__label">Title <span class="required">*</span></label>
        <input
            type="text"
            id="title"
            name="title"
            class="form__input"
            value="{{ title }}"
            required
            autofocus
            placeholder="Enter article title"
        />
        </div>

        <div class="form__group">
        <label for="published_at" class="form__label">Publication Date <span class="required">*</span></label>
        <input
            type="date"
            id="published_at"
            name="published_at"
            class="form__input form__input--date"
            value="{{ published_at }}"
            required
        />
        </div>

        <div class="form__group">
        <label for="content" class="form__label">Content <span class="required">*</span></label>
        <textarea
            id="content"
            name="content"
            class="form__textarea"
            rows="18"
            required
            placeholder="Write your article here…"
        >{{ content }}</textarea>
        </div>

        <div class="form__actions">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn--ghost">Cancel</a>
            <button type="submit" class="btn btn--primary">Publish Article</button>
        </div>
    </form>
</div>

{% endblock %}
