{% extends "base.html" %}
{% block title %}Edit Article — My Blog{% endblock %}
{% block content %}

<div class="form-page">
    <div class="form-page__header">
        <a href="{{ url_for('admin_dashboard') }}" class="back-link">← Back to Dashboard</a>
        <h1>Edit Article</h1>
    </div>

    <form method="POST" action="{{ url_for('admin_edit', slug=article.slug) }}" class="form form--wide" enctype="multipart/form-data">
        <div class="form__group">
            <label for="title" class="form__label">Title <span class="required">*</span></label>
            <input
                type="text"
                id="title"
                name="title"
                class="form__input"
                value="{{ title }}"
                required
                autofocus
                placeholder="Enter article title"
            />
        </div>

        <div class="form__group">
            <label for="published_at" class="form__label">Publication Date <span class="required">*</span></label>
            <input
                type="date"
                id="published_at"
                name="published_at"
                class="form__input form__input--date"
                value="{{ published_at }}"
                required
            />
        </div>

        <div class="form__group">
            <label for="thumbnail" class="form__label">Thumbnail Image</label>
            {% if thumbnail %}
                <div class="form__thumb-preview">
                    <img src="{{ url_for('static', filename='uploads/' + thumbnail) }}" alt="Current thumbnail" />
                    <span class="form__hint">Current thumbnail. Upload a new file to replace it.</span>
                </div>
            {% endif %}

            <input
                type="file"
                id="thumbnail"
                name="thumbnail"
                class="form__input form__input--file"
                accept="image/png,image/jpeg,image/gif,image/webp,image/avif"
            />

            {% if not thumbnail %}
                <span class="form__hint">Optional. PNG, JPG.</span>
            {% endif %}
        </div>

        <div class="form__group">
            <label for="content" class="form__label">Content <span class="required">*</span></label>
            <textarea
                id="content"
                name="content"
                class="form__textarea"
                rows="18"
                required
                placeholder="Write your article here…"
            >{{ content }}</textarea>
        </div>

        <div class="form__actions">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn--ghost">Cancel</a>
            <button type="submit" class="btn btn--primary">Save Changes</button>
        </div>
    </form>
</div>

{% endblock %}
